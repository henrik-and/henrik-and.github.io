<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>README</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    body {
      max-width: 900px;
      margin: 0 auto;
      padding: 24px 32px 48px;
      align-items: flex-start;
      line-height: 1.55;
      box-sizing: border-box;
    }
    #readme-content { width: 100%; }
    #readme-content .pre-wrap { position: relative; }
    #readme-content pre {
      background: #f5f5f5;
      border: 1px solid #ddd;
      border-radius: 6px;
      padding: 10px 68px 10px 12px;
      overflow-x: auto;
      white-space: pre-wrap;
      word-break: break-word;
    }
    #readme-content .pre-copy-btn {
      position: absolute;
      top: 8px;
      right: 8px;
      padding: 3px 9px;
      font-size: 12px;
      font-weight: 600;
      border: 1px solid #ccc;
      border-radius: 5px;
      background: #fff;
      color: #333;
      cursor: pointer;
    }
    #readme-content .pre-copy-btn:hover { background: #eee; }
    #readme-content code {
      background: #f0f0f0;
      padding: 1px 4px;
      border-radius: 3px;
    }
    #readme-content pre code { background: none; padding: 0; }
    @media (max-width: 600px) {
      body { padding: 16px; }
    }
  </style>
</head>
<body>
  <main id="readme-content"></main>
  <button id="copy-markdown-button">Copy as Markdown</button>
  <textarea id="markdown-source" style="display:none;"></textarea>

  <!-- Pinned version with SRI hash. Newer marked releases no longer ship
       marked.min.js, so the unpinned URL can break when jsDelivr updates. -->
  <script src="https://cdn.jsdelivr.net/npm/marked@15.0.12/marked.min.js"
          integrity="sha384-948ahk4ZmxYVYOc+rxN1H2gM1EJ2Duhp7uHtZ4WSLkV4Vtx5MUqnV+l7u9B+jFv+"
          crossorigin="anonymous"></script>
  <script>
    'use strict';

    async function displayReadme() {
      try {
        const response = await fetch(`README.md?v=${new Date().getTime()}`);
        if (!response.ok) {
          throw new Error(`HTTP error! status: ${response.status}`);
        }
        const markdown = await response.text();
        const readmeContent = document.getElementById('readme-content');
        const markdownSource = document.getElementById('markdown-source');
        if (readmeContent && markdownSource) {
          readmeContent.innerHTML = marked.parse(markdown);
          markdownSource.value = markdown;
          for (const pre of readmeContent.querySelectorAll('pre')) {
            const wrap = document.createElement('div');
            wrap.className = 'pre-wrap';
            pre.parentNode.insertBefore(wrap, pre);
            wrap.appendChild(pre);
            const btn = document.createElement('button');
            btn.type = 'button';
            btn.className = 'pre-copy-btn';
            btn.textContent = 'Copy';
            btn.addEventListener('click', async () => {
              const code = pre.querySelector('code');
              const text = (code ? code.textContent : pre.textContent).replace(/\s+$/, '') + '\n';
              try {
                await navigator.clipboard.writeText(text);
              } catch {
                const ta = document.createElement('textarea');
                ta.value = text;
                ta.style.position = 'fixed';
                ta.style.opacity = '0';
                document.body.appendChild(ta);
                ta.select();
                document.execCommand('copy');
                ta.remove();
              }
              btn.textContent = 'Copied!';
              setTimeout(() => { btn.textContent = 'Copy'; }, 1500);
            });
            wrap.appendChild(btn);
          }
        }
      } catch (error) {
        console.error('Error fetching or parsing README.md:', error);
        const readmeContent = document.getElementById('readme-content');
        if (readmeContent) {
          readmeContent.textContent = 'Error loading README content.';
        }
      }
    }

    function copyMarkdown() {
      const markdownSource = document.getElementById('markdown-source');
      if (markdownSource) {
        navigator.clipboard.writeText(markdownSource.value).then(() => {
          const copyButton = document.getElementById('copy-markdown-button');
          copyButton.textContent = 'Copied!';
          setTimeout(() => {
            copyButton.textContent = 'Copy as Markdown';
          }, 2000);
        }).catch(err => {
          console.error('Failed to copy text: ', err);
        });
      }
    }

    document.getElementById('copy-markdown-button').addEventListener('click', copyMarkdown);

    displayReadme();
  </script>
</body>
</html>
